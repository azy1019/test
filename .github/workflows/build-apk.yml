name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5.1'

      - name: Run parser tests
        run: |
          mkdir -p build/parser-tests
          javac -encoding UTF-8 -d build/parser-tests \
            app/src/main/java/com/miaoji/ledger/LedgerEntry.java \
            app/src/main/java/com/miaoji/ledger/NotificationTransactionParser.java \
            parser-tests/ParserTest.java
          java -cp build/parser-tests ParserTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: miaoji-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
